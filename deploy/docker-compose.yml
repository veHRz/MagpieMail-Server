# MagpieMail server with PostgreSQL.
#
#   task dev                 # creates deploy/.env if missing, then builds and starts
#   docker compose -f deploy/docker-compose.yml up -d
#
# Optional sidecars (AI, OCR, antivirus, Proton Bridge, VPN) will be added as
# compose profiles by later phases.

name: magpiemail

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: magpie
      POSTGRES_DB: magpie
      POSTGRES_PASSWORD: ${MAGPIEMAIL_DB_PASSWORD:?set MAGPIEMAIL_DB_PASSWORD in deploy/.env (run "task dev:env")}
    volumes:
      # PostgreSQL 18+ images keep their data under /var/lib/postgresql/<major>.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # TCP rather than the Unix socket: the temporary server that runs during
      # first-time initialization only listens on the socket.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=magpie", "--dbname=magpie"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 500ms
    networks:
      - backend

  magpie:
    image: ${MAGPIEMAIL_IMAGE:-magpiemail-server:dev}
    build:
      context: ..
    restart: unless-stopped
    command: ["serve"]
    environment:
      MAGPIE_DATABASE__URL: postgres://magpie:${MAGPIEMAIL_DB_PASSWORD:?set MAGPIEMAIL_DB_PASSWORD in deploy/.env (run "task dev:env")}@postgres:5432/magpie?sslmode=disable
    ports:
      # Loopback only: put a TLS reverse proxy in front to expose the API.
      - "127.0.0.1:${MAGPIEMAIL_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
      - default

networks:
  # PostgreSQL has no route to the Internet; only the server reaches it.
  backend:
    internal: true

volumes:
  pgdata:
