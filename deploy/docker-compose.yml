# MagpieMail server with PostgreSQL.
#
#   task dev                 # creates deploy/.env and the master key if missing, then builds and starts
#   docker compose -f deploy/docker-compose.yml up -d
#
# Optional sidecars (AI, OCR, antivirus, Proton Bridge, VPN) will be added as
# compose profiles by later phases.

name: magpiemail

x-magpie: &magpie
  image: ${MAGPIEMAIL_IMAGE:-magpiemail-server:dev}
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

secrets:
  # Server master key. Generated by `task dev:env`; never committed. Back it up
  # outside the server: without it, encrypted credentials and blobs are lost.
  master_key:
    file: ${MAGPIEMAIL_MASTER_KEY_FILE:-./secrets/master.key}

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: magpie
      POSTGRES_DB: magpie
      POSTGRES_PASSWORD: ${MAGPIEMAIL_DB_PASSWORD:?set MAGPIEMAIL_DB_PASSWORD in deploy/.env (run "task dev:env")}
    volumes:
      # PostgreSQL 18+ images keep their data under /var/lib/postgresql/<major>.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # TCP rather than the Unix socket: the temporary server that runs during
      # first-time initialization only listens on the socket.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=magpie", "--dbname=magpie"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 500ms
    networks:
      - backend

  # Applies pending migrations, then exits. The server starts once it succeeded.
  migrate:
    <<: *magpie
    command: ["migrate", "up"]
    restart: "no"
    environment:
      MAGPIE_DATABASE__URL: postgres://magpie:${MAGPIEMAIL_DB_PASSWORD:?set MAGPIEMAIL_DB_PASSWORD in deploy/.env (run "task dev:env")}@postgres:5432/magpie?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  magpie:
    <<: *magpie
    build:
      context: ..
    restart: unless-stopped
    command: ["serve"]
    environment:
      MAGPIE_DATABASE__URL: postgres://magpie:${MAGPIEMAIL_DB_PASSWORD:?set MAGPIEMAIL_DB_PASSWORD in deploy/.env (run "task dev:env")}@postgres:5432/magpie?sslmode=disable
      MAGPIE_SECURITY__MASTER_KEY_FILE: /run/secrets/master_key
    secrets:
      - master_key
    volumes:
      - blobs:/var/lib/magpie/blobs
    # Blob contents are spooled in /tmp while fingerprinted: keep them in memory.
    tmpfs:
      - /tmp:size=256m,mode=1777
    ports:
      # Loopback only: put a TLS reverse proxy in front to expose the API.
      - "127.0.0.1:${MAGPIEMAIL_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - default

networks:
  # PostgreSQL has no route to the Internet; only the server reaches it.
  backend:
    internal: true

volumes:
  pgdata:
  blobs:
