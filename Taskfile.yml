# https://taskfile.dev
version: "3"

vars:
  BIN: "{{.ROOT_DIR}}/.bin"
  GOLANGCI_LINT: "{{.BIN}}/golangci-lint"
  GITLEAKS: "{{.BIN}}/gitleaks"
  # Go-module tools are pinned in tools/go.mod, apart from the server's dependencies.
  GOTOOL: go tool -modfile=tools/go.mod
  OAPI_CONFIG: internal/transport/httpapi/oapi/oapi-codegen.yaml
  OAPI_OUTPUT: internal/transport/httpapi/oapi/oapi.gen.go
  # The race detector needs cgo and a C compiler: enabled whenever one is available (always in CI).
  RACE:
    sh: command -v "${CC:-cc}" >/dev/null 2>&1 && echo "-race" || true
  IMAGE: '{{.IMAGE | default "magpiemail-server:dev"}}'
  COMPOSE: docker compose -f deploy/docker-compose.yml
  VERSION:
    # Server releases are tagged vX.Y.Z; api-vX.Y.Z tags version the contract only.
    sh: git describe --tags --match "v[0-9]*" --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  LDFLAGS: >-
    -s -w
    -X github.com/veHRz/MagpieMail-Server/internal/buildinfo.Version={{.VERSION}}
    -X github.com/veHRz/MagpieMail-Server/internal/buildinfo.Commit={{.COMMIT}}

tasks:
  default:
    silent: true
    cmds:
      - task --list

  tools:
    desc: Install the pinned golangci-lint and gitleaks into .bin
    cmds:
      - ./scripts/install-tools.sh

  fmt:
    desc: Format Go code (gofumpt, goimports)
    deps: [tools]
    cmds:
      - "{{.GOLANGCI_LINT}} fmt ./..."

  lint:
    desc: Check formatting, go.mod tidiness, generated code; lint Go code, CI workflows and the API contract
    deps: [tools]
    cmds:
      - "{{.GOLANGCI_LINT}} fmt --diff ./..."
      - go mod tidy -diff
      - "{{.GOLANGCI_LINT}} run ./..."
      - "{{.GOTOOL}} actionlint"
      - task: gen:check
      - task: contract:lint

  test:
    desc: Run unit tests
    cmds:
      - go test {{.RACE}} ./...

  test:integration:
    desc: Run unit and integration tests against real services in containers (Docker required)
    cmds:
      - go test {{.RACE}} -tags=integration -count=1 ./...

  test:coverage:
    desc: Measure the repositories' coverage with the integration tests; fail below {{.MIN_COVERAGE}} %
    vars:
      MIN_COVERAGE: 80
    cmds:
      - go test -tags=integration -count=1 -coverpkg=./internal/store/postgres -coverprofile=coverage.out ./internal/store/...
      - ./scripts/check-coverage.sh coverage.out {{.MIN_COVERAGE}}

  check:
    desc: Format check, lint and unit tests
    cmds:
      - task: lint
      - task: test

  audit:
    desc: Scan dependencies for known vulnerabilities and the git history for secrets
    deps: [tools]
    cmds:
      - "{{.GOTOOL}} govulncheck ./..."
      - "{{.GITLEAKS}} git --redact --no-banner ."

  gen:
    desc: Regenerate code from the OpenAPI contract and the SQL queries
    cmds:
      - "{{.GOTOOL}} oapi-codegen -config {{.OAPI_CONFIG}} api/openapi.yaml"
      - ./scripts/sqlc.sh generate

  gen:check:
    desc: Fail when the generated code does not match the contract or the SQL queries
    cmds:
      - defer: rm -rf {{.TMPDIR}}
      - 'sed "s|^output: .*|output: {{.TMPDIR}}/oapi.gen.go|" {{.OAPI_CONFIG}} > {{.TMPDIR}}/oapi-codegen.yaml'
      - "{{.GOTOOL}} oapi-codegen -config {{.TMPDIR}}/oapi-codegen.yaml api/openapi.yaml"
      - cmp -s {{.TMPDIR}}/oapi.gen.go {{.OAPI_OUTPUT}} || (echo "{{.OAPI_OUTPUT}} is stale; run 'task gen'" >&2; exit 1)
      - ./scripts/sqlc.sh diff || (echo "internal/store/postgres/gen is stale, or sqlc could not run (see above); run 'task gen'" >&2; exit 1)
    vars:
      TMPDIR:
        sh: mktemp -d

  contract:lint:
    desc: Lint the API contract (no problem allowed) and check the house rules still fire
    cmds:
      - ./scripts/lint-contract.sh

  contract:build:
    desc: Build the publishable contract into dist/api (bundle, version, offline HTML reference)
    cmds:
      - ./scripts/build-contract.sh

  contract:release:
    desc: Tag main as api-vX.Y.Z and push the tag, which publishes the contract (-- --dry-run to check)
    cmds:
      - ./scripts/release-contract.sh {{.CLI_ARGS}}
  build:
    desc: Build the magpie binary into bin/
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o bin/magpie ./cmd/magpie

  image:
    desc: Build the container image (IMAGE=name:tag to override)
    cmds:
      - docker build --build-arg VERSION={{.VERSION}} --build-arg COMMIT={{.COMMIT}} -t {{.IMAGE}} .

  smoke:
    desc: Check the image (size, user, invalid config) and the stack (/readyz within 10 s)
    deps: [image]
    cmds:
      - ./scripts/smoke.sh {{.IMAGE}}

  dev:env:
    desc: Create deploy/.env (database password) and deploy/secrets/master.key, if missing
    cmds:
      - task: dev:env:file
      - task: dev:env:key

  dev:env:file:
    internal: true
    status:
      - test -f deploy/.env
    cmds:
      - cp deploy/.env.example deploy/.env
      - sed -i.bak "s/^MAGPIEMAIL_DB_PASSWORD=.*/MAGPIEMAIL_DB_PASSWORD=$(openssl rand -hex 24)/" deploy/.env && rm deploy/.env.bak
      - chmod 600 deploy/.env

  dev:env:key:
    internal: true
    status:
      - test -f deploy/secrets/master.key
    cmds:
      # The directory is private; the file is world-readable so that the
      # container's non-root user can read the bind-mounted secret.
      - mkdir -p deploy/secrets && chmod 700 deploy/secrets
      - openssl rand -base64 32 > deploy/secrets/master.key
      - chmod 444 deploy/secrets/master.key
      - 'echo "Generated deploy/secrets/master.key: back it up outside this machine."'

  dev:
    desc: Run the full stack with docker compose (server and PostgreSQL)
    deps: [dev:env]
    cmds:
      - "{{.COMPOSE}} up --build {{.CLI_ARGS}}"

  dev:down:
    desc: Stop the stack (task dev:down -- -v also deletes the database volume)
    cmds:
      - "{{.COMPOSE}} down {{.CLI_ARGS}}"
