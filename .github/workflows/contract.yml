# Publishes the API contract when scripts/release-contract.sh pushes an
# api-vX.Y.Z tag: a GitHub release with the bundled contract, its version, an
# offline HTML reference and checksums. The client repository fetches these.
name: Contract release

on:
  push:
    tags: ["api-v*"]

permissions:
  contents: read

jobs:
  release:
    name: Publish the API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Authenticated pulls: anonymous ones share the runners' Docker Hub quota.
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "No Docker Hub credentials (fork pull request?): pulling anonymously."
            exit 0
          fi
          # Strip whitespace that pasting a secret may add.
          username="$(printf '%s' "${DOCKERHUB_USERNAME}" | tr -d '[:space:]')"
          printf '%s' "${DOCKERHUB_TOKEN}" | tr -d '[:space:]' | docker login --username "${username}" --password-stdin
      - name: Check that the tag matches the contract version
        run: |
          version="$(scripts/contract-version.sh)"
          if [[ "${GITHUB_REF_NAME}" != "api-v${version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match info.version ${version}" >&2
            exit 1
          fi
      - name: Lint the contract
        run: scripts/lint-contract.sh
      - name: Build the release assets
        run: scripts/build-contract.sh
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat dist/api/VERSION)"
          gh release create "${GITHUB_REF_NAME}" dist/api/* \
            --verify-tag \
            --title "API contract ${version}" \
            --notes "MagpieMail API contract ${version} (OpenAPI 3.1).

          - \`openapi.yaml\`: the contract, bundled into one file.
          - \`VERSION\`: its version.
          - \`api-reference.tar.gz\`: HTML reference that works offline (open \`api-reference/index.html\`).
          - \`SHA256SUMS\`: checksums."
